# ============================================================
# T-box: 线性代数（Linear Algebra）
# ============================================================
# Oracle sources:
#   - Gilbert Strang, Introduction to Linear Algebra, 5th ed.
#   - 同济大学《线性代数》（第六版）
#   - 大学线性代数课程讲义（SIAS）
#
# 本文件定义线性代数领域的本体：概念、求解方法、验证规则。
# 运行时求解器（scripts/domain_solvers.py::solve_matrix_ext）据此分类与求解。
# ============================================================

domain: linear_algebra
version: "1.0"

oracle_sources:
  - type: textbook
    ref: "Strang, Introduction to Linear Algebra, 5th ed."
    authority: primary
    distilled_knowledge:
      - "行列式：|A| = 0 ⟺ A 奇异；|AB| = |A||B|"
      - "逆矩阵：A⁻¹ = adj(A)/|A|；(AB)⁻¹ = B⁻¹A⁻¹"
      - "特征值：|λI − A| = 0；迹 = 特征值之和；det = 特征值之积"
      - "秩：行化简非零行数；rank(A) ≤ min(m, n)"
      - "线性方程组：Ax = b 有解 ⟺ b ∈ col(A)；齐次只有平凡解 ⟺ rank = n"
  - type: textbook
    ref: "同济大学《线性代数》第六版"
    authority: primary
    distilled_knowledge:
      - "克拉默法则：xᵢ = |Aᵢ|/|A|（|A| ≠ 0）"
      - "初等行变换化简矩阵求逆的标准流程"
      - "特征向量：对每个特征值解 (A − λI)x = 0 的基础解系"
  - type: instructor_guide
    ref: "线性代数课程讲义（线性方程组与矩阵运算章节）"
    authority: secondary
    distilled_knowledge:
      - "矩阵乘法：C = AB，cᵢⱼ = Σₖ aᵢₖ bₖⱼ；注意 AB ≠ BA"
      - "对称矩阵：Aᵀ = A；其特征值必为实数"
      - "正交矩阵：AᵀA = I，|A| = ±1"

concepts:
  - id: matrix
    type: concept
    name: "矩阵"
    formal: "m×n 数表 A = (a_ij)"
    sympy: "Matrix"
  - id: determinant
    type: concept
    name: "行列式"
    formal: "det(A)，方阵的标量值"
    sympy: "det"
    solves: [solve_det, solve_inverse, solve_eigen]
  - id: inverse_matrix
    type: concept
    name: "逆矩阵"
    formal: "A⁻¹ 满足 AA⁻¹ = A⁻¹A = I"
    sympy: "A.inv()"
    requires: [determinant]
  - id: eigenvalue
    type: concept
    name: "特征值与特征向量"
    formal: "Av = λv，v ≠ 0"
    sympy: "A.eigenvects()"
    requires: [determinant]
  - id: rank
    type: concept
    name: "矩阵的秩"
    formal: "行最简形非零行数"
    sympy: "A.rank()"
  - id: linear_system
    type: concept
    name: "线性方程组"
    formal: "Ax = b"
    sympy: "linsolve"
    requires: [matrix]

solution_methods:
  - id: solve_det
    name: "行列式求解"
    trigger: ["行列式", "determinant", "det"]
    steps:
      - "确认方阵"
      - "按行展开或直接 det(A)"
  - id: solve_inverse
    name: "逆矩阵求解"
    trigger: ["逆矩阵", "inverse", "^{-1}"]
    steps:
      - "计算 |A|"
      - "A⁻¹ = adj(A)/|A|（SymPy: A.inv()）"
  - id: solve_eigen
    name: "特征值特征向量"
    trigger: ["特征值", "eigenvalue", "特征向量"]
    steps:
      - "解特征多项式 |λI − A| = 0"
      - "对每个 λ 解 (A − λI)x = 0"
  - id: solve_linear_system
    name: "线性方程组求解"
    trigger: ["方程组", "linear system", "solve the system"]
    steps:
      - "列出方程组"
      - "linsolve 求通解"

validation_rules:
  - "det(A) 必须为方阵"
  - "逆矩阵存在 ⟺ det(A) ≠ 0"
  - "特征向量非零"
  - "方程个数与未知数不一致时输出通解形式"
